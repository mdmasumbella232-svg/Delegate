# ==============================================================
# Cloudflare Pages + Workers + D1 Config — BCS Quiz App
# ==============================================================

name = "bcs-quiz-worker"
main = "worker/index.js"
compatibility_date = "2024-01-01"

# ── D1 Database binding ─────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "bcs-quiz-db"
database_id = "aafe1c0b-2769-4afc-8477-a970b87c44fa"

# ── Pages deployment config ─────────────────────────────────
pages_build_output_dir = "."

# ── Environment variables ───────────────────────────────────
[vars]
APP_NAME = "BCS Quiz"
APP_VERSION = "1.0.0"

# ── Local dev settings ──────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"
